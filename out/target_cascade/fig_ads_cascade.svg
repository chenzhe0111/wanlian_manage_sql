<text x="550" y="440" text-anchor="middle" font-size="12" fill="#8F959E">校验：赵磊14.65 + 董亮9.77 = 24.42万｜②③④⑤不背运单绝对数，背拆岗产出物</text>

<rect x="40" y="470" width="1020" height="280" rx="12" fill="#FAFAFA" stroke="#DEE0E3"/>
<text x="60" y="500" font-size="13" font-weight="700" fill="#1F2329">分法逻辑（对齐拆岗「职能中项」）</text>
<text x="60" y="528" font-size="12" fill="#646A73">①效果投放 ← 司/货两端效果广告投放获客（赵磊信息流 + 董亮商店）+ 投放中台渠道侧</text>
<text x="60" y="554" font-size="12" fill="#646A73">②直播增长 ← 直播运营及中台支持（郭倩玉运营 + 靳晨飞切片）</text>
<text x="60" y="580" font-size="12" fill="#646A73">③品牌宣发 ← 品牌建设与推广 + 媒体对接与传播（何萃婷）</text>
<text x="60" y="606" font-size="12" fill="#646A73">④内容获客 ← 内容营销-新媒体获客（郭倩玉官号 + 张栩萍矩阵/短视频）</text>
<text x="60" y="632" font-size="12" fill="#646A73">⑤创意与数据中台 ← 平面/视频素材支持 + 投放中台 + 品牌转化数据评估（郑显渡/靳晨飞/赵婧）</text>
<text x="60" y="668" font-size="12" fill="#646A73">目标原则：部门运单包只落①；②～⑤用拆岗「指标/目标产出物」作个人目标，写清如何支撑①的漏斗与运单</text>
<text x="60" y="700" font-size="12" fill="#8F959E">一人多块（郭倩玉：②+④；靳晨飞：②+⑤；赵磊：①+⑤）分线跟盯，不重复分运单包</text>
