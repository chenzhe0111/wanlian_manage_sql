<text x="48" y="624" font-size="12" fill="#4E5969">坐席B/C：指标相同，均分时运单各 3.21万；有客户包则留存按包、新增按权重。</text>
<text x="48" y="646" font-size="12" fill="#4E5969">负责人额外扛：部门合计 9.63万、人力 36、外呼总量 18.26万。</text>
